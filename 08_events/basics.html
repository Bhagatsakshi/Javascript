    /*simple task - after clicking img it should remove 
    so we use tagname ,as if we use parentNode ,then also it works but probelm is that
    after clicking on li /ul ,all imgs remove at once .so using tagname we can check iss it euqal to img or not ,then remove
    */
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName);   //tagName gives tag like li ,IMG or etc tag
        if (e.target.tagName === 'IMG') {   
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    
        
    })
    
    //removeIt.parentNode.removeChild(removeIt) ,another method for remove
